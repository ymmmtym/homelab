version: '3'

vars:
  TALOSCONFIG: ./talosconfig

tasks:
  talosconfig:get:
    aliases:
      - tc
    cmds:
      - |
        set -eu
        tmp_json=$(mktemp)
        tmp_err=$(mktemp)
        tmp_yaml=$(mktemp "{{.TALOSCONFIG}}.XXXXXX")
        trap 'rm -f "$tmp_json" "$tmp_err" "$tmp_yaml"' EXIT

        if ! terraform output -json talosconfig >"$tmp_json" 2>"$tmp_err"; then
          echo "Error: failed to read the 'talosconfig' output from Terraform." >&2
          sed 's/^/  /' "$tmp_err" >&2
          echo "If the output is not defined, uncomment the talos_cluster module and its outputs in main.tf." >&2
          exit 1
        fi

        if ! yq -e '.talos_config' "$tmp_json" >"$tmp_yaml"; then
          echo "Error: the 'talosconfig' output does not contain a talos_config value." >&2
          exit 1
        fi

        mv "$tmp_yaml" "{{.TALOSCONFIG}}"

  kubeconfig:update:
    aliases:
      - kc
      - kubeconfig
    deps:
      - talosconfig:get
    cmds:
      - |
        set -eu
        if [ ! -f "{{.TALOSCONFIG}}" ]; then
          echo "Error: {{.TALOSCONFIG}} not found. Run 'task tc' first." >&2
          exit 1
        fi

        control_plane_ip=$(yq eval '.contexts.cluster.endpoints[0]' "{{.TALOSCONFIG}}")
        if [ -z "$control_plane_ip" ] || [ "$control_plane_ip" = "null" ]; then
          echo "Error: failed to read the control plane endpoint from {{.TALOSCONFIG}}." >&2
          exit 1
        fi

        talosctl config endpoints "$control_plane_ip"
        talosctl kubeconfig --nodes "$control_plane_ip"
    env:
      TALOSCONFIG: "{{.TALOSCONFIG}}"

  terraform:taint:vms:
    aliases:
      - taint
    cmds:
      - terraform state list | grep 'proxmox_virtual_environment_vm.talos' | xargs -n1 terraform taint

  terraform:untaint:vms:
    aliases:
      - untaint
    cmds:
      - terraform state list | grep 'proxmox_virtual_environment_vm.talos' | xargs -n1 terraform untaint
