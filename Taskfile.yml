version: '3'

vars:
  TALOSCONFIG: ./talosconfig

tasks:
  talosconfig:get:
    aliases:
      - tc
    cmds:
      - |
        if ! terraform output -json talosconfig >/dev/null 2>&1; then
          echo "Error: 'talosconfig' output is not available."
          echo "Uncomment the talos_cluster module and its outputs in main.tf to enable this task."
          exit 1
        fi
        terraform output -json talosconfig | yq '.talos_config' > {{.TALOSCONFIG}}
    sources:
      - ./*.tf
    generates:
      - "{{.TALOSCONFIG}}"
    method: timestamp

  kubeconfig:update:
    aliases:
      - kc
      - kubeconfig
    deps:
      - talosconfig:get
    cmds:
      - |
        if [ ! -f "{{.TALOSCONFIG}}" ]; then
          echo "Error: {{.TALOSCONFIG}} not found. Run 'task tc' first."
          exit 1
        fi
      - talosctl config endpoints "{{.CONTROL_PLANE_IP}}"
      - talosctl kubeconfig --nodes "{{.CONTROL_PLANE_IP}}"
    env:
      TALOSCONFIG: "{{.TALOSCONFIG}}"
    vars:
      CONTROL_PLANE_IP:
        sh: yq eval '.contexts.cluster.endpoints[0]' {{.TALOSCONFIG}}

  terraform:taint:vms:
    aliases:
      - taint
    cmds:
      - terraform state list | grep 'proxmox_virtual_environment_vm.talos' | xargs -n1 terraform taint

  terraform:untaint:vms:
    aliases:
      - untaint
    cmds:
      - terraform state list | grep 'proxmox_virtual_environment_vm.talos' | xargs -n1 terraform untaint
